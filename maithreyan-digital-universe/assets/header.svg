 <ellipse rx="178" ry="102" stroke="#00eaff" stroke-opacity=".7" stroke-width="1.2" transform="rotate(28)"/>
 <ellipse rx="138" ry="174" stroke="#9871ff" stroke-opacity=".7" stroke-width="1.5" transform="rotate(66)"/>
