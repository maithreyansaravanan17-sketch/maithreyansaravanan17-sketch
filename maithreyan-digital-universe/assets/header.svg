<g text-anchor="middle" font-family="Arial,Helvetica,sans-serif">
 <text x="600" y="65" fill="#77f7ff" font-size="12" letter-spacing="7">PERSONAL DIGITAL UNIVERSE / NODE 001</text>
 <text x="600" y="225" fill="#f1fbff" font-size="43" font-weight="700" letter-spacing="4">MAITHREYAN</text>
 <text x="600" y="270" fill="#f1fbff" font-size="43" font-weight="700" letter-spacing="4">SARAVANAN</text>
 <text x="600" y="316" fill="#9beeff" font-size="13" letter-spacing="3">STUDENT DEVELOPER  //  AI EXPLORER  //  ROBOTICS BUILDER</text>
