 <path d="M-68 105V-40Q-68-94 0-94Q68-94 68-40V105" stroke="#00f5ff" stroke-opacity=".7" stroke-width="1.2"/>
 <path d="M-260 0H260" stroke="url(#beam)" stroke-width="2"/>
</g>
