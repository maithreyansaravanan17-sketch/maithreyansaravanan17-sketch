<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Maithreyan Saravanan — Digital Dimension</title>
<desc id="desc">A luminous cyan and violet portal suspended above a perspective grid in a deep-space digital environment.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050711"/><stop offset=".55" stop-color="#0b1021"/><stop offset="1" stop-color="#130a25"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#00eaff" stop-opacity=".22"/><stop offset=".55" stop-color="#7755ff" stop-opacity=".10"/><stop offset="1" stop-color="#050711" stop-opacity="0"/></radialGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00f5ff"/><stop offset=".48" stop-color="#8b5cff"/><stop offset="1" stop-color="#00f5ff"/></linearGradient>
  <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#00eaff" stop-opacity="0"/><stop offset=".5" stop-color="#00eaff" stop-opacity=".8"/><stop offset="1" stop-color="#a879ff" stop-opacity="0"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#2b91b8" stroke-opacity=".22" stroke-width="1"/></pattern>
</defs>
